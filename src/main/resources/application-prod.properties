spring.application.name=mymovies-backend

# === DATASOURCE (Railway: valori da variabili d'ambiente) ===
spring.datasource.url=${DATABASE_URL}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA / Hibernate ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# === Server / Railway ===
server.port=${PORT:8080}
server.forward-headers-strategy=native

# === CORS (origini abilitate) ===
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://tiziano-occhionero.github.io,http://localhost:4200}
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type,Accept
spring.mvc.dispatch-options-request=true
