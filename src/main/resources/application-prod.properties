spring.application.name=mymovies-backend

# === DATASOURCE (Render: valori da variabili d'ambiente) ===
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA / Hibernate ===
spring.jpa.hibernate.ddl-auto=update           # per cominciare; in futuro passa a 'validate' con Flyway
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# === Server / Render ===
server.port=${PORT:8080}
server.forward-headers-strategy=native

# === CORS (origini abilitate) ===
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://tiziano-occhionero.github.io,https://tiziano-occhionero.github.io/my-movies-collection}
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type,Accept
